# Render Blueprint for TalentScope AI (free tier).
# Deploy: push this repo to GitHub, then Render Dashboard -> New -> Blueprint -> pick the repo.
#
# Free-tier notes:
#  - Web services sleep after 15 min idle; the first request then takes ~1 min to wake.
#  - No persistent disk, so CVs are stored encrypted inside Postgres (STORAGE_BACKEND=db).
#  - No background workers, so searches run in-process (TASK_RUNNER_MODE=local).
#  - Free Postgres databases expire 30 days after creation unless upgraded.

databases:
  - name: talentscope-db
    plan: free
    databaseName: talentscope
    user: talentscope
    postgresMajorVersion: "16"

services:
  # ---------- FastAPI backend (Docker: includes Tesseract OCR) ----------
  - type: web
    name: talentscope-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: talentscope-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Secret for CV encryption at rest. Generated once; never change it or stored CVs become unreadable.
      - key: FILE_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: db
      - key: TASK_RUNNER_MODE
        value: local
      - key: VERIFY_MAX_CONCURRENCY
        value: "6"
      # Optional AI provider (deterministic NLP engine is used when "none")
      - key: LLM_PROVIDER
        value: none
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional keyed job sources
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: JSEARCH_API_KEY
        sync: false

  # ---------- Next.js frontend (proxies /api/v1/* to the backend) ----------
  - type: web
    name: talentscope-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Public URL of the backend service above. Service names are global on onrender.com, so
      # Render usually appends a suffix (e.g. talentscope-api-x1y2.onrender.com). After the first
      # deploy, copy the real URL from the talentscope-api page, set it here in the Render
      # dashboard (talentscope-web -> Environment) and redeploy. The default below is a placeholder.
      - key: BACKEND_URL
        value: https://talentscope-api.onrender.com
