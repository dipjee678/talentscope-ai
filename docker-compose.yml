services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentscope-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentscope_secret}
      POSTGRES_DB: ${POSTGRES_DB:-talentscope}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: talentscope-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentscope-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talentscope}:${POSTGRES_PASSWORD:-talentscope_secret}@postgres:5432/${POSTGRES_DB:-talentscope}
      TASK_RUNNER_MODE: celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - cv_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentscope-celery-worker
    command: celery -A app.workers.tasks:celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-talentscope}:${POSTGRES_PASSWORD:-talentscope_secret}@postgres:5432/${POSTGRES_DB:-talentscope}
      TASK_RUNNER_MODE: celery
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - cv_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: talentscope-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  cv_uploads:
